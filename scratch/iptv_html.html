<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Org Global - Truyền Hình Trực Tiếp Theo Quốc Gia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-base: #090c15;
            --bg-card: rgba(18, 24, 38, 0.75);
            --bg-card-hover: rgba(28, 38, 60, 0.85);
            --bg-accent: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            background: rgba(9, 12, 21, 0.85);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-badge {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            background: var(--bg-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: none;
        }

        .btn-stremio {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
        }

        .btn-stremio:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Main Layout */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            padding: 20px 24px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 1080px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Video Area */
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        #videoPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .player-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .player-info-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .channel-main-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .channel-avatar {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            background: #1e293b;
            padding: 6px;
            object-fit: contain;
            border: 1px solid var(--border-color);
        }

        .channel-titles h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-live {
            background: #ef4444;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .channel-meta-tags {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .meta-tag {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 10px;
            border-radius: 20px;
            color: var(--text-sub);
        }

        /* Country Navigation Bar */
        .country-nav {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .country-nav::-webkit-scrollbar {
            height: 4px;
        }

        .country-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .country-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .country-pill:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateY(-1px);
        }

        .country-pill.active {
            background: var(--bg-accent);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .country-dropdown-select {
            background: #1e293b;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        /* Sidebar Channel List */
        .sidebar-section {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 18px;
            height: calc(100vh - 120px);
            position: sticky;
            top: 80px;
        }

        @media (max-width: 1080px) {
            .sidebar-section {
                height: 500px;
                position: static;
            }
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 14px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #6366f1;
        }

        .category-filter-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .cat-chip {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .cat-chip.active {
            background: #3b82f6;
            color: #fff;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
            scrollbar-width: thin;
        }

        .channel-list::-webkit-scrollbar {
            width: 5px;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-item:hover {
            background: var(--bg-card-hover);
            transform: translateX(3px);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .channel-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            box-shadow: inset 3px 0 0 #3b82f6;
        }

        .channel-item img {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            background: #1e293b;
            object-fit: contain;
            padding: 3px;
        }

        .channel-item-details {
            flex: 1;
            min-width: 0;
        }

        .channel-item-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-item-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .res-badge {
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 1px 6px;
            border-radius: 4px;
            color: #93c5fd;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: #fff;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="/iptv/tv" class="logo-area">
            <div class="logo-badge">
                <i class="fa-solid fa-satellite-dish"></i>
            </div>
            <div class="logo-text">
                <h1>IPTV ORG GLOBAL</h1>
                <p>200+ Quốc Gia • Miễn Phí • Trực Tiếp M3U8</p>
            </div>
        </a>

        <div class="header-actions">
            <button class="btn btn-copy" onclick="copyManifestUrl()">
                <i class="fa-regular fa-clone"></i> Copy Manifest
            </button>
            <a href="stremio://127.0.0.1:7860/iptv/manifest.json" class="btn btn-stremio">
                <i class="fa-solid fa-play"></i> Thêm vào Stremio
            </a>
        </div>
    </header>

    <!-- Main Body Container -->
    <div class="main-container">
        
        <!-- Left: Video Area & Country Switcher -->
        <div class="player-section">
            <!-- Video Player -->
            <div class="video-wrapper">
                <video id="videoPlayer" controls autoplay playsinline></video>
                <div id="playerOverlay" class="player-overlay">
                    <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: #60a5fa;"></i>
                    <p id="overlayText">Đang kết nối luồng phát...</p>
                </div>
            </div>

            <!-- Current Playing Channel Info -->
            <div class="player-info-card">
                <div class="channel-main-info">
                    <img id="currentLogo" class="channel-avatar" src="https://raw.githubusercontent.com/iptv-org/iptv/master/banner.png" alt="Channel Logo">
                    <div class="channel-titles">
                        <h2 id="currentTitle">Chọn một kênh để phát <span class="badge-live">LIVE</span></h2>
                        <div class="channel-meta-tags">
                            <span id="currentCountry" class="meta-tag">🌐 Quốc Gia: VN</span>
                            <span id="currentGroup" class="meta-tag">📁 Thể Loại: General</span>
                            <span id="currentRes" class="meta-tag">⚡ Độ phân giải: HD</span>
                        </div>
                    </div>
                </div>
                <div>
                    <button class="btn btn-copy" onclick="reloadStream()" title="Làm mới luồng">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Horizontal Country Pills Navigation -->
            <div class="country-nav" id="countryNav">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Right: Channel List Sidebar -->
        <div class="sidebar-section">
            <div class="sidebar-header">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm kênh trong nước này..." oninput="onSearchInput()">
                </div>
                <div class="category-filter-bar" id="categoryFilterBar">
                    <span class="cat-chip active" onclick="filterCategory('All')">Tất cả</span>
                </div>
            </div>

            <!-- List of Channels -->
            <div class="channel-list" id="channelList">
                <div style="text-align:center; padding: 40px; color: var(--text-sub);">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 10px;">Đang tải danh sách kênh...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-check-circle"></i>
        <span id="toastMsg">Đã sao chép liên kết Manifest!</span>
    </div>

    <script>
        const MANIFEST_URL = "http://127.0.0.1:7860/iptv/manifest.json";
        let currentCountry = "vn".toLowerCase();
        let allChannels = [];
        let filteredChannels = [];
        let selectedCategory = "All";
        let activeChannel = null;
        let hlsInstance = null;

        const popularCountries = [{"code": "VN", "name": "Vi\u1ec7t Nam", "flag": "\ud83c\uddfb\ud83c\uddf3"}, {"code": "US", "name": "United States", "flag": "\ud83c\uddfa\ud83c\uddf8"}, {"code": "UK", "name": "United Kingdom", "flag": "\ud83c\uddec\ud83c\udde7"}, {"code": "JP", "name": "Nh\u1eadt B\u1ea3n (Japan)", "flag": "\ud83c\uddef\ud83c\uddf5"}, {"code": "KR", "name": "H\u00e0n Qu\u1ed1c (South Korea)", "flag": "\ud83c\uddf0\ud83c\uddf7"}, {"code": "FR", "name": "Ph\u00e1p (France)", "flag": "\ud83c\uddeb\ud83c\uddf7"}, {"code": "DE", "name": "\u0110\u1ee9c (Germany)", "flag": "\ud83c\udde9\ud83c\uddea"}, {"code": "CN", "name": "Trung Qu\u1ed1c (China)", "flag": "\ud83c\udde8\ud83c\uddf3"}, {"code": "TH", "name": "Th\u00e1i Lan (Thailand)", "flag": "\ud83c\uddf9\ud83c\udded"}, {"code": "SG", "name": "Singapore", "flag": "\ud83c\uddf8\ud83c\uddec"}, {"code": "CA", "name": "Canada", "flag": "\ud83c\udde8\ud83c\udde6"}, {"code": "AU", "name": "\u00dac (Australia)", "flag": "\ud83c\udde6\ud83c\uddfa"}, {"code": "ES", "name": "T\u00e2y Ban Nha (Spain)", "flag": "\ud83c\uddea\ud83c\uddf8"}, {"code": "IT", "name": "\u00dd (Italy)", "flag": "\ud83c\uddee\ud83c\uddf9"}, {"code": "IN", "name": "\u1ea4n \u0110\u1ed9 (India)", "flag": "\ud83c\uddee\ud83c\uddf3"}, {"code": "BR", "name": "Brazil", "flag": "\ud83c\udde7\ud83c\uddf7"}, {"code": "RU", "name": "Nga (Russia)", "flag": "\ud83c\uddf7\ud83c\uddfa"}, {"code": "HK", "name": "H\u1ed3ng K\u00f4ng (Hong Kong)", "flag": "\ud83c\udded\ud83c\uddf0"}, {"code": "TW", "name": "\u0110\u00e0i Loan (Taiwan)", "flag": "\ud83c\uddf9\ud83c\uddfc"}, {"code": "ID", "name": "Indonesia", "flag": "\ud83c\uddee\ud83c\udde9"}, {"code": "MY", "name": "Malaysia", "flag": "\ud83c\uddf2\ud83c\uddfe"}, {"code": "PH", "name": "Philippines", "flag": "\ud83c\uddf5\ud83c\udded"}, {"code": "NL", "name": "H\u00e0 Lan (Netherlands)", "flag": "\ud83c\uddf3\ud83c\uddf1"}, {"code": "PT", "name": "B\u1ed3 \u0110\u00e0o Nha (Portugal)", "flag": "\ud83c\uddf5\ud83c\uddf9"}, {"code": "MX", "name": "Mexico", "flag": "\ud83c\uddf2\ud83c\uddfd"}, {"code": "AR", "name": "Argentina", "flag": "\ud83c\udde6\ud83c\uddf7"}, {"code": "TR", "name": "Th\u1ed5 Nh\u0129 K\u1ef3 (Turkey)", "flag": "\ud83c\uddf9\ud83c\uddf7"}, {"code": "SA", "name": "Saudi Arabia", "flag": "\ud83c\uddf8\ud83c\udde6"}, {"code": "AE", "name": "UAE", "flag": "\ud83c\udde6\ud83c\uddea"}];

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            renderCountryNav();
            loadChannels(currentCountry);
        });

        function renderCountryNav() {
            const nav = document.getElementById("countryNav");
            let html = "";
            popularCountries.forEach(c => {
                const isActive = c.code.toLowerCase() === currentCountry;
                html += `
                    <div class="country-pill ${isActive ? 'active' : ''}" onclick="switchCountry('${c.code.toLowerCase()}')">
                        <span>${c.flag}</span>
                        <span>${c.name}</span>
                    </div>
                `;
            });

            html += `
                <select class="country-dropdown-select" onchange="switchCountry(this.value)">
                    <option value="">➕ Chọn quốc gia khác...</option>
                    <option value="ar">🇦🇷 Argentina</option>
                    <option value="au">🇦🇺 Australia</option>
                    <option value="br">🇧🇷 Brazil</option>
                    <option value="ca">🇨🇦 Canada</option>
                    <option value="cn">🇨🇳 China</option>
                    <option value="de">🇩🇪 Germany</option>
                    <option value="es">🇪🇸 Spain</option>
                    <option value="fr">🇫🇷 France</option>
                    <option value="uk">🇬🇧 United Kingdom</option>
                    <option value="hk">🇭🇰 Hong Kong</option>
                    <option value="id">🇮🇩 Indonesia</option>
                    <option value="in">🇮🇳 India</option>
                    <option value="it">🇮🇹 Italy</option>
                    <option value="jp">🇯🇵 Japan</option>
                    <option value="kr">🇰🇷 South Korea</option>
                    <option value="my">🇲🇾 Malaysia</option>
                    <option value="mx">🇲🇽 Mexico</option>
                    <option value="nl">🇳🇱 Netherlands</option>
                    <option value="ph">🇵🇭 Philippines</option>
                    <option value="pt">🇵🇹 Portugal</option>
                    <option value="ru">🇷🇺 Russia</option>
                    <option value="sa">🇸🇦 Saudi Arabia</option>
                    <option value="sg">🇸🇬 Singapore</option>
                    <option value="th">🇹🇭 Thailand</option>
                    <option value="tr">🇹🇷 Turkey</option>
                    <option value="tw">🇹🇼 Taiwan</option>
                    <option value="us">🇺🇸 United States</option>
                    <option value="vn">🇻🇳 Vietnam</option>
                </select>
            `;
            nav.innerHTML = html;
        }

        async function switchCountry(code) {
            if (!code) return;
            currentCountry = code.toLowerCase();
            renderCountryNav();
            document.getElementById("searchInput").value = "";
            selectedCategory = "All";
            await loadChannels(currentCountry);
        }

        async function loadChannels(countryCode) {
            const listEl = document.getElementById("channelList");
            listEl.innerHTML = `
                <div style="text-align:center; padding: 40px; color: var(--text-sub);">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 10px;">Đang tải kênh ${countryCode.toUpperCase()}...</p>
                </div>
            `;

            try {
                const res = await fetch(`/iptv/api/channels?country=${countryCode}`);
                const data = await res.json();
                allChannels = data.channels || [];
                extractCategories();
                renderCategoryChips();
                filterAndRenderChannels();

                // Auto play first channel if available
                if (allChannels.length > 0) {
                    playChannel(allChannels[0]);
                } else {
                    document.getElementById("overlayText").innerText = "Không tìm thấy kênh phát.";
                }
            } catch (e) {
                listEl.innerHTML = `<div style="text-align:center; padding: 30px; color: #ef4444;">Lỗi tải dữ liệu kênh.</div>`;
            }
        }

        function extractCategories() {
            const categories = new Set(["All"]);
            allChannels.forEach(c => {
                if (c.group) {
                    c.group.split(";").forEach(g => categories.add(g.trim()));
                }
            });
            window.extractedCategories = Array.from(categories);
        }

        function renderCategoryChips() {
            const container = document.getElementById("categoryFilterBar");
            let html = `<span class="cat-chip ${selectedCategory === 'All' ? 'active' : ''}" onclick="filterCategory('All')">Tất cả</span>`;
            if (window.extractedCategories) {
                window.extractedCategories.filter(c => c !== "All").forEach(cat => {
                    const isActive = selectedCategory === cat;
                    html += `<span class="cat-chip ${isActive ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</span>`;
                });
            }
            container.innerHTML = html;
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            renderCategoryChips();
            filterAndRenderChannels();
        }

        function onSearchInput() {
            filterAndRenderChannels();
        }

        function filterAndRenderChannels() {
            const q = document.getElementById("searchInput").value.toLowerCase().trim();
            filteredChannels = allChannels.filter(c => {
                const matchesCat = selectedCategory === "All" || (c.group && c.group.includes(selectedCategory));
                const matchesQuery = !q || c.title.toLowerCase().includes(q) || (c.tvg_id && c.tvg_id.toLowerCase().includes(q));
                return matchesCat && matchesQuery;
            });

            const listEl = document.getElementById("channelList");
            if (filteredChannels.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-sub);">Không có kênh nào phù hợp.</div>`;
                return;
            }

            let html = "";
            filteredChannels.forEach(c => {
                const isActive = activeChannel && activeChannel.id === c.id;
                const logo = c.logo || "https://raw.githubusercontent.com/iptv-org/iptv/master/banner.png";
                html += `
                    <div class="channel-item ${isActive ? 'active' : ''}" onclick='playChannelById("${c.id}")'>
                        <img src="${logo}" onerror="this.src='https://raw.githubusercontent.com/iptv-org/iptv/master/banner.png'" alt="${c.title}">
                        <div class="channel-item-details">
                            <div class="channel-item-name">${c.title}</div>
                            <div class="channel-item-sub">
                                <span class="res-badge">${c.resolution || 'HD'}</span>
                                <span>${c.group || 'General'}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function playChannelById(id) {
            const ch = allChannels.find(c => c.id === id);
            if (ch) playChannel(ch);
        }

        function playChannel(ch) {
            activeChannel = ch;
            filterAndRenderChannels();

            document.getElementById("currentTitle").innerHTML = `${ch.title} <span class="badge-live">LIVE</span>`;
            document.getElementById("currentLogo").src = ch.logo || "https://raw.githubusercontent.com/iptv-org/iptv/master/banner.png";
            document.getElementById("currentCountry").innerText = `🌐 Quốc Gia: ${ch.country || currentCountry.toUpperCase()}`;
            document.getElementById("currentGroup").innerText = `📁 Thể Loại: ${ch.group || 'General'}`;
            document.getElementById("currentRes").innerText = `⚡ Độ phân giải: ${ch.resolution || 'HD'}`;

            const video = document.getElementById("videoPlayer");
            const overlay = document.getElementById("playerOverlay");
            const overlayText = document.getElementById("overlayText");

            overlay.classList.remove("hidden");
            overlayText.innerText = `Đang kết nối luồng: ${ch.title}...`;

            if (Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });
                hlsInstance.loadSource(ch.url);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    overlay.classList.add("hidden");
                    video.play().catch(() => {});
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                overlayText.innerText = "Lỗi mạng hoặc luồng bị gián đoạn. Đang thử lại...";
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                overlayText.innerText = "Đang khôi phục giải mã phương tiện...";
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                overlayText.innerText = "Không thể phát kênh này. Vui lòng chọn kênh khác.";
                                break;
                        }
                    }
                });
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                // Native Safari / iOS HLS
                video.src = ch.url;
                video.addEventListener("loadedmetadata", () => {
                    overlay.classList.add("hidden");
                    video.play();
                });
            } else {
                overlayText.innerText = "Trình duyệt không hỗ trợ phát HLS trực tiếp.";
            }
        }

        function reloadStream() {
            if (activeChannel) {
                playChannel(activeChannel);
            }
        }

        function copyManifestUrl() {
            navigator.clipboard.writeText(MANIFEST_URL).then(() => {
                showToast("Đã sao chép liên kết Manifest vào bộ nhớ tạm!");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = msg;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }
    </script>
</body>
</html>
