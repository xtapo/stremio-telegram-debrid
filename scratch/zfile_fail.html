<script>
    var cf_token = "";
    function toastr(title, message) {
        var toast = document.createElement("div");
        toast.innerHTML = `<div class="toast-header">
					<strong class="me-auto">${title}</strong>
					<button type="button" class="btn-close" data-mdb-dismiss="toast" aria-label="Close"></button>
				</div>
				<div class="toast-body">${message}</div>`;
        toast.classList.add("toast", "fade");
        document.body.appendChild(toast);
        var toastInstance = new mdb.Toast(toast, {
            stacking: true,
            hidden: true,
            width: "450px",
            position: "top-right",
            autohide: true,
            delay: 3e3
        });
        toastInstance.show()
    }
    async function generate(action = "cloud") {
        var formData = new FormData;
        formData.append("action", action);
        formData.append("key", "3b36c951a486395a62e4a8a0e2fce1c7d75c7cb7");
        formData.append("action_token", cf_token);
        var response = await fetch(window.location.pathname, {
            method: "POST",
            headers: {
                'x-token': window.location.hostname,
            },
            body: formData
        }),
            data = "";
        try {
            data = await response.json()
        } catch (error) { }
        return data
    }
    if (document.getElementById("cloud") !== null) {
        document.getElementById("cloud").onclick = function () {
            setan("cloud", true);
            this.disabled = true;
            this.innerHTML = "";
            var span = document.createElement("span"),
                text = document.createTextNode(" Generating.."),
                or = "Generating File";
            span.setAttribute("class", "spinner-border spinner-border-sm");
            this.appendChild(span);
            this.appendChild(text);
            generate("cloud").then(data => {
                setan("cloud");
                if (data.visit_url) {
                    this.innerHTML = or;
                    this.disabled = false;
                    window.location.href = data.visit_url;
                } else if (data.url) {
                    this.innerHTML = or;
                    this.disabled = false;
                    window.location.href = data.url;
                } else {
                    this.innerHTML = or;
                    this.disabled = false;
                    if (data.error) {
                        toastr("alert", data.message)
                    } else {
                        toastr("alert", "Oops, error.")
                    }
                }
            });
        };
    }

    function setan(action, hide = false) {
        if (document.getElementById(action) !== null) {
            var actn = document.getElementById(action);
            if (!hide) {
                actn.disabled = false;
            } else {
                actn.disabled = true;
            }
        }
    }

</script>
